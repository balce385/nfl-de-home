name: NFL Data + News Scrapers

on:
  # Kein Zeitplan mehr: GitHub loeste ihn ab 2026-08-24 nicht mehr aus, obwohl
  # der Workflow "active" war. Die Scraper laufen seit 2026-09-26 per Cron auf
  # dem VPS (balce385/deploy-stack: crontab, scrape.sh); ob er laeuft, zeigt
  # https://nfl-fan-app.de/api/health. Ein zweiter Zeitplan hier wuerde parallel
  # schreiben (depth_charts wird geloescht und neu gefuellt). Nur noch manuell.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run-Mode'
        required: false
        default: 'news'
        type: choice
        options: ['news', 'full']

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Die Scraper importieren sich relativ (from .common import ...) und muessen
      # deshalb als Paket `scrapers` vom Repo-Wurzelverzeichnis aus laufen.
      # pyproject.toml installiert nur die Abhaengigkeiten, kein eigenes Paket.
      - name: Install dependencies
        run: pip install ./scrapers

      # mode=news -> nur News
      - name: Run news scraper only
        if: ${{ inputs.mode == 'news' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scrapers.nfl_news

      # mode=full -> alle Scraper
      - name: Run all scrapers
        if: ${{ inputs.mode == 'full' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scrapers.run_all
